<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>new-api 压测控制台</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --border:#272b36; --fg:#e6e8ee; --muted:#8b93a7; --acc:#4f8cff; --ok:#3fb950; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; }
  @media (max-width: 980px){ .wrap { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .panel h2 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .panel h2 .dot { width:8px; height:8px; border-radius:50%; background:var(--acc); }
  fieldset { border:1px solid var(--border); border-radius:8px; margin:0 0 12px; padding:10px 12px; }
  legend { color:var(--muted); font-size:12px; padding:0 6px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 12px; }
  .grid.one { grid-template-columns:1fr; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  label code { color:var(--fg); font-size:11px; opacity:.65; font-family:ui-monospace,Menlo,Consolas,monospace; }
  input, select, textarea { background:#0d0f16; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:6px 8px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
  input[type=checkbox] { width:16px; height:16px; }
  textarea { resize:vertical; min-height:56px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); }
  button.stop { background:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .cmd { background:#0d0f16; border:1px solid var(--border); border-radius:6px; padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; color:#cdd3e0; }
  .log { background:#0a0c11; border:1px solid var(--border); border-radius:6px; padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; height:260px; overflow:auto; white-space:pre-wrap; color:#c7ceda; }
  .log .l-err { color:var(--err); }
  .status { font-size:12px; color:var(--muted); }
  .status.run { color:var(--ok); }
  .toggle { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border-radius:0; padding:5px 12px; }
  .toggle button.active { background:var(--acc); color:#fff; }
  .hint { color:var(--muted); font-size:11px; margin-top:-2px; }
  .profiles { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .profiles select { min-width:140px; }
</style>
</head>
<body>
<header>
  <h1>new-api 压测控制台</h1>
  <span class="sub">填表 → 生成/复制命令，或直接启动并查看实时输出（单二进制，mock 与压测器均由本程序拉起）</span>
</header>

<div class="wrap">

  <!-- ============ MOCK ============ -->
  <div class="panel" id="mock">
    <h2><span class="dot"></span>Mock 上游 <span class="status" id="mock-status">未运行</span></h2>
    <fieldset><legend>延迟与内容</legend>
      <div class="grid">
        <label>监听端口 <code>-port</code><input data-flag="-port" value="18080"></label>
        <label>暴露模型 <code>-models</code><input data-flag="-models" value="" placeholder="留空=内置约40个常见模型"></label>
        <label>最小总延迟 <code>-latency-min</code><input data-flag="-latency-min" value="300ms"></label>
        <label>最大总延迟 <code>-latency-max</code><input data-flag="-latency-max" value="2s"></label>
        <label>流式首包最小延迟 <code>-ttfb-min</code><input data-flag="-ttfb-min" value="50ms"></label>
        <label>流式首包最大延迟 <code>-ttfb-max</code><input data-flag="-ttfb-max" value="300ms"></label>
        <label>最小补全词数 <code>-tokens-min</code><input data-flag="-tokens-min" value="20"></label>
        <label>最大补全词数 <code>-tokens-max</code><input data-flag="-tokens-max" value="200"></label>
        <label>视频生成耗时 <code>-video-process-time</code><input data-flag="-video-process-time" value="3s"></label>
      </div>
    </fieldset>
    <fieldset><legend>错误注入 / 真实媒体（可选）</legend>
      <div class="grid">
        <label>错误注入概率 <code>-error-rate</code><input data-flag="-error-rate" value=""></label>
        <label>错误码权重 <code>-error-codes</code><input data-flag="-error-codes" value=""></label>
        <label>图片素材文件 <code>-image-file</code><input data-flag="-image-file" value=""></label>
        <label>音频素材文件 <code>-audio-file</code><input data-flag="-audio-file" value=""></label>
        <label>视频素材文件 <code>-video-file</code><input data-flag="-video-file" value=""></label>
      </div>
    </fieldset>
    <div class="cmd" id="mock-cmd"></div>
    <div class="row">
      <button class="ghost" onclick="copyCmd('mock')">复制命令</button>
      <button id="mock-run" onclick="run('mock')">启动 Mock</button>
      <button class="stop" id="mock-stopbtn" onclick="stopJob('mock')" disabled>停止</button>
    </div>
    <div class="log" id="mock-log"></div>
  </div>

  <!-- ============ LOADGEN ============ -->
  <div class="panel" id="load">
    <h2><span class="dot"></span>压测器 loadgen <span class="status" id="load-status">未运行</span></h2>

    <fieldset><legend>目标与通用</legend>
      <div class="grid">
        <label>目标地址 <code>-url</code><input data-flag="-url" value="http://127.0.0.1:3000/v1/chat/completions"></label>
        <label>模型 <code>-model</code><input data-flag="-model" value="gpt-4o-mini"></label>
        <label>并发数 <code>-c</code><input data-flag="-c" value="200"></label>
        <label>压测时长 <code>-d</code><input data-flag="-d" value="120s"></label>
        <label>单请求超时 <code>-timeout</code><input data-flag="-timeout" value="120s"></label>
      </div>
      <label style="margin-top:8px">令牌（可填多个，模拟多用户并发） <code>-token</code>
        <textarea data-flag="-token" rows="3" placeholder="每行或逗号分隔一个令牌，例如：&#10;sk-aaaa&#10;sk-bbbb&#10;sk-cccc&#10;（留空=直压 mock 基线，不带鉴权）"></textarea>
      </label>
      <div class="hint">填多个令牌时，各并发 worker（虚拟用户）按顺序轮流使用不同令牌，等价于多个用户同时请求；worker 数多于令牌数时会循环复用。</div>
    </fieldset>

    <div class="row">
      <span class="status">模式：</span>
      <div class="toggle" id="mode">
        <button data-mode="closed" class="active" type="button" onclick="setMode('closed')">闭环基准</button>
        <button data-mode="sim" type="button" onclick="setMode('sim')">生产模拟</button>
      </div>
    </div>

    <fieldset id="grp-closed"><legend>闭环基准</legend>
      <div class="grid">
        <label>请求格式 <code>-format</code>
          <select data-flag="-format">
            <option>openai</option><option>claude</option><option>gemini</option>
            <option>image</option><option>speech</option><option>transcription</option>
          </select>
        </label>
        <label>流式请求占比 <code>-stream-ratio</code><input data-flag="-stream-ratio" value="0.5"></label>
        <label>预热时长 <code>-warmup</code><input data-flag="-warmup" value=""></label>
        <label>最大生成 token <code>-max-tokens</code><input data-flag="-max-tokens" value="256"></label>
        <label>prompt 词数 <code>-prompt-words</code><input data-flag="-prompt-words" value="30"></label>
      </div>
    </fieldset>

    <fieldset id="grp-sim" style="display:none"><legend>生产模拟（-sim）</legend>
      <div class="grid">
        <label>昼夜周期 <code>-sim-period</code><input data-flag="-sim-period" value="1h"></label>
        <label>报告间隔 <code>-report-interval</code><input data-flag="-report-interval" value="60s"></label>
        <label>白天并发比例 <code>-sim-day-frac</code><input data-flag="-sim-day-frac" value="0.6"></label>
        <label>夜间并发比例 <code>-sim-night-frac</code><input data-flag="-sim-night-frac" value="0.1"></label>
        <label>抖动幅度 <code>-sim-jitter</code><input data-flag="-sim-jitter" value="0.15"></label>
        <label>突发概率 <code>-sim-spike-rate</code><input data-flag="-sim-spike-rate" value="0.03"></label>
        <label>突发倍数 <code>-sim-spike-mult</code><input data-flag="-sim-spike-mult" value="2.5"></label>
        <label>思考间隔下限 <code>-sim-think-min</code><input data-flag="-sim-think-min" value="500ms"></label>
        <label>思考间隔上限 <code>-sim-think-max</code><input data-flag="-sim-think-max" value="8s"></label>
      </div>
      <label style="margin-top:8px">请求类型混合（类型:权重,…） <code>-sim-mix</code><input data-flag="-sim-mix" value="chat-stream:45,chat:35,image:10,speech:7,transcription:3"></label>
      <div class="grid" style="margin-top:8px">
        <label>图像模型 <code>-image-model</code><input data-flag="-image-model" value="dall-e-3"></label>
        <label>TTS 模型 <code>-tts-model</code><input data-flag="-tts-model" value="tts-1"></label>
        <label>STT 模型 <code>-stt-model</code><input data-flag="-stt-model" value="whisper-1"></label>
        <label>Claude 模型 <code>-claude-model</code><input data-flag="-claude-model" value="claude-3-5-sonnet-20241022"></label>
      </div>
    </fieldset>

    <fieldset><legend>报告 / 资源采样（可选）</legend>
      <div class="grid">
        <label>JSON 报告路径 <code>-report</code><input data-flag="-report" value=""></label>
        <label>中文报告路径（仅闭环） <code>-report-zh</code><input data-flag="-report-zh" value=""></label>
        <label>网关性能接口 <code>-perf-url</code><input data-flag="-perf-url" value=""></label>
        <label>管理员令牌 <code>-admin-token</code><input data-flag="-admin-token" value=""></label>
        <label>管理员用户 ID <code>-admin-user-id</code><input data-flag="-admin-user-id" value=""></label>
        <label>MySQL DSN <code>-mysql-dsn</code><input data-flag="-mysql-dsn" value=""></label>
      </div>
    </fieldset>

    <div class="cmd" id="load-cmd"></div>
    <div class="row">
      <button class="ghost" onclick="copyCmd('load')">复制命令</button>
      <button id="load-run" onclick="run('load')">启动压测</button>
      <button class="stop" id="load-stopbtn" onclick="stopJob('load')" disabled>停止</button>
      <span class="profiles">
        <select id="prof-list" onchange="loadProfile()"><option value="">— 预设 —</option></select>
        <button class="ghost" onclick="saveProfile()">保存预设</button>
        <button class="ghost" onclick="delProfile()">删除</button>
      </span>
    </div>
    <div class="log" id="load-log"></div>
  </div>

</div>

<script>
// 复制命令用的等价基命令（源码运行）；实际「启动」由控制台用本二进制自身拉起，无需 go 工具链。
const CMDBASE = { mock: "go run ./bench mockai", load: "go run ./bench loadgen" };
let mode = "closed";
const jobs = { mock: null, load: null }; // id + EventSource

// 把 -token 的多行/逗号/空格输入归一为逗号分隔的令牌列表。
function normTokens(v){ return (v||"").split(/[\s,]+/).filter(Boolean).join(","); }

// 收集某面板内、可见且非空的 data-flag 字段 → 参数数组
function collectArgs(panelId){
  const args = [];
  const panel = document.getElementById(panelId);
  panel.querySelectorAll("[data-flag]").forEach(el=>{
    // 隐藏的分组（display:none）跳过
    if (el.closest("fieldset") && el.closest("fieldset").style.display === "none") return;
    const flag = el.getAttribute("data-flag");
    let v = (el.value||"").trim();
    if (flag === "-token") v = normTokens(v);
    if (v === "") return;
    args.push(flag, v);
  });
  if (panelId === "load" && mode === "sim") args.unshift("-sim");
  return args;
}

function quote(s){ return /[\s"']/.test(s) ? '"'+s.replace(/"/g,'\\"')+'"' : s; }
// 令牌脱敏（仅用于屏幕预览，避免密钥明文常驻页面）
function maskTokenVal(v){
  return v.split(",").map(t=>{ t=t.trim(); return t ? (t.length>8 ? t.slice(0,6)+"***" : "***") : ""; }).filter(Boolean).join(",");
}
function cmdString(panelId, mask){
  const args = collectArgs(panelId);
  const parts = [];
  for (let i=0;i<args.length;i++){
    if (mask && args[i]==="-token" && i+1<args.length){
      parts.push(quote(args[i])); parts.push(quote(maskTokenVal(args[i+1]))); i++;
    } else {
      parts.push(quote(args[i]));
    }
  }
  return CMDBASE[panelId] + " " + parts.join(" ");
}
function refresh(){
  // 屏幕预览脱敏令牌；复制到剪贴板时用真实值（见 copyCmd）以便可直接运行。
  document.getElementById("mock-cmd").textContent = cmdString("mock", true);
  document.getElementById("load-cmd").textContent = cmdString("load", true);
}
document.addEventListener("input", refresh);

function setMode(m){
  mode = m;
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
  document.getElementById("grp-closed").style.display = m==="closed" ? "" : "none";
  document.getElementById("grp-sim").style.display = m==="sim" ? "" : "none";
  refresh();
}

function copyCmd(panelId){
  navigator.clipboard.writeText(cmdString(panelId, false)).then(()=>flash(panelId,"命令已复制（含真实令牌）"));
}
function flash(panelId, msg){
  const s = document.getElementById(panelId+"-status");
  const old = s.textContent, cls = s.className;
  s.textContent = msg;
  setTimeout(()=>{ if(!jobs[panelId]){ s.textContent = old; s.className = cls; } }, 1400);
}

function appendLog(panelId, line, isErr){
  const log = document.getElementById(panelId+"-log");
  const near = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  const div = document.createElement("div");
  if (isErr) div.className = "l-err";
  div.textContent = line;
  log.appendChild(div);
  while (log.childNodes.length > 3000) log.removeChild(log.firstChild);
  if (near) log.scrollTop = log.scrollHeight;
}

async function run(panelId){
  if (jobs[panelId]) return;
  const args = collectArgs(panelId);
  document.getElementById(panelId+"-log").innerHTML = "";
  let res;
  try {
    res = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({tool: panelId==="mock"?"mockai":"loadgen", args})});
  } catch(e){ appendLog(panelId, "启动失败: "+e, true); return; }
  if (!res.ok){ appendLog(panelId, "启动失败: HTTP "+res.status+" "+await res.text(), true); return; }
  const {id} = await res.json();
  setRunning(panelId, id);
  const es = new EventSource("/api/stream/"+id);
  jobs[panelId] = {id, es};
  es.onmessage = e => appendLog(panelId, e.data, false);
  es.addEventListener("stderr", e => appendLog(panelId, e.data, true));
  es.addEventListener("done", e => { appendLog(panelId, "—— 进程结束（"+e.data+"）——", false); cleanup(panelId); });
  es.onerror = () => { cleanup(panelId); };
}
function setRunning(panelId, id){
  const s = document.getElementById(panelId+"-status");
  s.textContent = "运行中 · 任务 "+id; s.className = "status run";
  document.getElementById(panelId+"-run").disabled = true;
  document.getElementById(panelId+"-stopbtn").disabled = false;
}
function cleanup(panelId){
  if (jobs[panelId] && jobs[panelId].es) jobs[panelId].es.close();
  jobs[panelId] = null;
  const s = document.getElementById(panelId+"-status");
  s.textContent = "未运行"; s.className = "status";
  document.getElementById(panelId+"-run").disabled = false;
  document.getElementById(panelId+"-stopbtn").disabled = true;
}
async function stopJob(panelId){
  if (!jobs[panelId]) return;
  await fetch("/api/stop/"+jobs[panelId].id, {method:"POST"}).catch(()=>{});
}

// ---- 预设（localStorage）----
function formState(){
  const st = {mode};
  document.querySelectorAll("#load [data-flag]").forEach(el=> st[el.getAttribute("data-flag")] = el.value);
  return st;
}
function applyState(st){
  if (st.mode) setMode(st.mode);
  document.querySelectorAll("#load [data-flag]").forEach(el=>{
    const f = el.getAttribute("data-flag");
    if (st[f] !== undefined) el.value = st[f];
  });
  refresh();
}
function profiles(){ try { return JSON.parse(localStorage.getItem("loadgen-profiles")||"{}"); } catch(e){ return {}; } }
function renderProfiles(){
  const sel = document.getElementById("prof-list");
  const p = profiles();
  sel.innerHTML = '<option value="">— 预设 —</option>' + Object.keys(p).map(n=>`<option>${n}</option>`).join("");
}
function saveProfile(){
  const name = prompt("预设名称：");
  if (!name) return;
  const p = profiles(); p[name] = formState();
  localStorage.setItem("loadgen-profiles", JSON.stringify(p));
  renderProfiles(); document.getElementById("prof-list").value = name;
}
function loadProfile(){
  const name = document.getElementById("prof-list").value;
  if (!name) return;
  const p = profiles(); if (p[name]) applyState(p[name]);
}
function delProfile(){
  const name = document.getElementById("prof-list").value;
  if (!name) return;
  const p = profiles(); delete p[name];
  localStorage.setItem("loadgen-profiles", JSON.stringify(p));
  renderProfiles();
}

renderProfiles();
setMode("closed");
refresh();
</script>
</body>
</html>
